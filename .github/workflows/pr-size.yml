# Pull request size gate. See openspec/specs/pr-size-gate/spec.md.
#
# The job name `pr-size` is the status check context required by the
# `protect-main` ruleset. Renaming it also requires updating the ruleset.
name: pr-size

on:
  pull_request:
    # labeled/unlabeled re-run the gate when the owner toggles size/override.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          # The PR head itself, not GitHub's synthetic merge commit, so the
          # measurement is exactly what the author pushed and does not move
          # when main changes underneath the PR.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history of every branch, which includes origin/<base_ref>
          # that the gate diffs against.
          fetch-depth: 0

      - name: Test the gate script
        run: scripts/ci/pr-size-test.sh

      - name: Measure the pull request
        env:
          PR_SIZE_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'size/override') }}
        run: scripts/ci/pr-size.sh "origin/${{ github.base_ref }}"
