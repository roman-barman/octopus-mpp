# Pull request size gate. See openspec/specs/pr-size-gate/spec.md.
#
# The job name `pr-size` is the status check context required by the
# `protect-main` ruleset. Renaming it also requires updating the ruleset.
name: pr-size

on:
  pull_request:
    # labeled/unlabeled re-run the gate when the owner toggles size/override.
    # edited re-runs it when the base branch changes (a stacked pull request
    # retargeted to main), so that the verdict belongs to the current base.
    # GitHub sends edited for title and body edits too, and the gate
    # deliberately runs on those as well: skipping them with an `if` would
    # report a skipped check, which a required check accepts as passed.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

# One run per pull request at a time. A newer event (a push, a base change,
# a label, an edit of the title or body) cancels the run of an older one, so
# the run queued last decides the verdict. That is normally the newest
# event, with the current base and labels; GitHub does not promise the order
# of two events of the same second, so this narrows that race, it does not
# remove it. A cancelled run shows the check as cancelled until its
# successor finishes a few seconds later: watch the newest run, not the one
# a push started.
concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # The measuring step asks GitHub for the pull request's current base
  # branch and labels.
  pull-requests: read

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          # The PR head itself, not GitHub's synthetic merge commit, so the
          # measurement is exactly what the author pushed and does not move
          # when main changes underneath the PR.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history of every branch, which includes the base branch
          # that the gate diffs against.
          fetch-depth: 0

      - name: Test the gate script
        run: scripts/ci/pr-size-test.sh

      - name: Measure the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The base branch and the labels are read from GitHub now, not taken
        # from the event that started the run. "Re-run" on an old run replays
        # its old event, so a run that passed against a former base, or while
        # size/override was set, would otherwise pass again. Reading the base
        # into a shell variable also keeps a branch name out of the text of
        # the command, where a name like `x$(...)` would be executed.
        run: |
          base="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)"
          labels="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          override=false
          if grep -qxF 'size/override' <<< "$labels"; then
            override=true
          fi
          echo "base branch: $base, size/override: $override"
          PR_SIZE_OVERRIDE="$override" scripts/ci/pr-size.sh "origin/$base"
