# Quality gates. See openspec/changes/quality-gates/specs/ci-quality-gates/spec.md.
#
# One job per gate, each running the one command the README documents for
# running that gate locally, so that a local and a CI verdict agree. Every
# job name is a status check context the owner adds to the `protect-main`
# ruleset (quality-gates task 5.1); from then on renaming a job also
# requires updating the ruleset.
#
# Only first-party actions are used. The toolchain comes from
# `rust-toolchain.toml`, which the runner's rustup honors automatically.
name: ci

on:
  # Every pull request, whatever its base: an implementation PR stacked on a
  # `spec/<change>` branch gets its verdict before it is retargeted to `main`.
  pull_request:
  # A pull request can read only the caches of its own branch and of `main`,
  # so the gates also run on `main` after a merge: that run saves the caches
  # every later pull request starts from.
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tool versions pinned for CI and the developer alike (design D5).
  CARGO_DENY_VERSION: 0.20.2

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded crates and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          # On a Cargo.lock change, start from the newest cache of this job
          # and rebuild only what changed.
          restore-keys: clippy-${{ runner.os }}-
      - name: Lint the workspace, warnings are errors
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded crates and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          # On a Cargo.lock change, start from the newest cache of this job
          # and rebuild only what changed.
          restore-keys: test-${{ runner.os }}-
      - name: Run the tests that need no external service
        run: cargo test --workspace

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded crates and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: doc-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          # On a Cargo.lock change, start from the newest cache of this job
          # and rebuild only what changed.
          restore-keys: doc-${{ runner.os }}-
      - name: Build the documentation, warnings are errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the tool binary is cached, keyed on its version and the toolchain
      # it was built with. The guard below is what makes the cache useful:
      # cargo decides "already installed" from ~/.cargo/.crates.toml, which is
      # not cached, and would otherwise rebuild the tool on every run. Restore
      # and save are separate steps so that the binary is saved even when the
      # check itself fails; `actions/cache` alone saves only on a green job.
      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-deny unless cached
        run: '[ -x ~/.cargo/bin/cargo-deny ] || cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"'
      - name: Save cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.cargo-deny-cache.outputs.cache-primary-key }}
      - name: Check advisories, licenses, duplicate versions, and sources
        run: cargo deny check

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the crate dependency direction gate
        run: scripts/ci/crate-deps-test.sh
      - name: Check the crate dependency direction (design D2 of v1-read-only-engine)
        run: scripts/ci/crate-deps.sh
