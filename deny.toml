# cargo-deny configuration: the `deny` quality gate.
#
# Run locally with the pinned tool version (CI installs the same one):
#   cargo install cargo-deny --locked --version 0.20.2
#   cargo deny check
#
# See openspec/changes/quality-gates/design.md D7. Every relaxation added here
# (a new license, a `skip` entry) is a reviewed change with a comment saying
# which dependency needs it.

[graph]
# Check the workspace as it is built on Linux x86-64, the only platform the
# binaries ship for; this keeps Windows- and macOS-only crates out of the
# duplicate-version check.
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# Known vulnerabilities fail the gate. Unmaintained and unsound crates, and
# crates yanked from the registry, are reported as warnings so that the owner
# sees them without blocking an unrelated pull request.
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "warn"
# ignore = ["RUSTSEC-0000-0000"]  # format for an accepted advisory, with a reason

[licenses]
# Permissive licenses only; a crate licensed under none of these fails the gate.
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # `ring` is dual licensed; its OpenSSL part is permissive.
    "OpenSSL",
]
# How sure the SPDX detection must be before a license text is accepted.
confidence-threshold = 0.8
# The list above is written ahead of the dependency tree (task 1.3 of
# `v1-read-only-engine` brings it), so entries no crate uses yet are not noise.
unused-allowed-license = "allow"

[bans]
# Two versions of one crate in the lock file fail the gate. Task 1.3 of
# `v1-read-only-engine` adds `skip` entries only for the duplicates it cannot
# avoid, each with a comment naming the crates that cause it.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = []
skip-tree = []

[sources]
# crates.io plus the two git repositories `v1-read-only-engine` D1 names for
# a pinned Ballista branch: upstream and the project's staging fork.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/apache/datafusion-ballista",
    "https://github.com/roman-barman/datafusion-ballista",
]
